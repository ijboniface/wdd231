<main id="main"><section class="page-hero"><div class="container"><span class="kicker">Film submission</span><h1>Help us document another story.</h1><p>Share the basic information and a source we can verify.</p></div></section>
<section class="section"><div class="container">
<form class="submit-card" action="form-action.html" method="get">
<div class="form-grid two"><div><label for="name">Your name</label><input id="name" name="name" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" required></div></div>
<div class="form-grid two"><div><label for="title">Film title</label><input id="title" name="title" required></div><div><label for="country">Country</label><input id="country" name="country" required></div></div>
<div class="form-grid two"><div><label for="director">Director / filmmaker</label><input id="director" name="director"></div><div><label for="year">Release year</label><input id="year" name="year" type="number" min="1900" max="2100"></div></div>
<div><label for="source">Film website or reliable source</label><input id="source" name="source" type="url" placeholder="https://example.com"></div>
<div><label for="reason">Why should it be included?</label><textarea id="reason" name="reason" required></textarea></div>
<button class="btn btn-primary" type="submit">Submit film</button><p class="note submission-note"></p>
</form></div></section></main>
