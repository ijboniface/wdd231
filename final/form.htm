<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit a Film | Gospelwood</title>
    <meta name="description" content="Submit a film for consideration in the Gospelwood directory.">
    <meta name="author" content="I.J. Boniface">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F2933'/%3E%3Cpath d='M20 17h24v30H20z' fill='%23D99A2B'/%3E%3Cpath d='M26 23h12v18H26z' fill='%231F2933'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/form.js"></script>
</head>

<body>
    <header class="site-header">
        <div class="container nav-wrap"><a class="brand" href="index.html"><span
                    class="brand-mark">GW</span><span>African Film Directory</span></a></div>
    </header>
    <main id="main">
        <section class="page-hero">
            <div class="container"><span class="kicker">Film submission</span>
                <h1>Help us document another story.</h1>
                <p>Share the basic information and a source we can verify.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <form class="submit-card" action="submit.html" method="get">
                    <div class="form-grid two">
                        <div><label for="name">Your name</label><input id="name" name="name" required></div>
                        <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
                    </div>
                    <div class="form-grid two">
                        <div><label for="title">Film title</label><input id="title" name="title" required></div>
                        <div><label for="country">Country</label><input id="country" name="country" required></div>
                    </div>
                    <div class="form-grid two">
                        <div><label for="director">Director / filmmaker</label><input id="director" name="director">
                        </div>
                        <div><label for="year">Release year</label><input id="year" name="year" type="number" min="1900"
                                max="2100"></div>
                    </div>
                    <div><label for="source">Film website or reliable source</label><input id="source" name="source"
                            type="url" placeholder="https://example.com"></div>
                    <div><label for="reason">Why should it be included?</label><textarea id="reason" name="reason"
                            required></textarea></div>
                    <button class="btn btn-primary" type="submit">Submit film</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p><a href="index.html">← Back to Gospelwood</a> · <a href="attributions.html">Attributions</a></p>
        </div>
    </footer>
</body>

</html>
